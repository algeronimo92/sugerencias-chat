# Umbrales tomados de docs/analisis/07-analisis-mensajeria.md §5.7
# ("Observabilidad y alertas") — ahí está el razonamiento detrás de cada uno.
groups:
  - name: negocio
    rules:
      - alert: OutboxAtascado
        expr: outbox_oldest_pending_age_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mensajes esperando en message_outbox hace más de 2 minutos"
          description: "Los vendedores están mandando mensajes que no salen. outbox_oldest_pending_age_seconds = {{ $value }}s."

      # Se vigila la ventana de 1h, no el total (`outbox_failed`): nada purga
      # message_outbox y un job solo sale de failed por reintento manual, así
      # que el acumulado histórico deja la alerta disparada para siempre —
      # pasó con 58 fallos viejos ya descartados. El total sigue en el
      # dashboard, que es donde el número acumulado sí dice algo.
      - alert: OutboxFallosRecientes
        expr: outbox_failed_last_hour > 3
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Más de 3 mensajes agotaron sus reintentos en la última hora"
          description: "Evolution API caído o mal configurado. outbox_failed_last_hour = {{ $value }}."

      - alert: AutomatizacionesFallando
        expr: automation_failed_last_hour > 5
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: "Más de 5 automatizaciones fallaron en la última hora"

      - alert: MensajesProgramadosParados
        expr: scheduled_messages_due_unprocessed > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Hay mensajes programados vencidos sin procesar"
          description: "El worker de scheduled_messages parece detenido."

  - name: infraestructura
    rules:
      - alert: BackendCaido
        expr: sum(up{job="backend"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ningún color (blue/green) del backend responde"

      - alert: PostgresCaido
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL no responde"

  # No se incluye acá a los contenedores de la app (sugerencias-chat-blue-*/
  # -green-*): apagar el color inactivo es el comportamiento NORMAL de cada
  # deploy blue-green, así que un "contenedor desapareció" sobre esos
  # nombres dispararía en cada release. Solo se vigila lo que NUNCA debería
  # desaparecer por sí solo. Backend/Postgres "caído de verdad" ya lo cubre
  # BackendCaido/PostgresCaido arriba (que sí toleran el color apagado).
  - name: contenedores
    rules:
      # El `max by (name)` no es cosmético. container_last_seen lleva también
      # el id del contenedor, así que recrear traefik o postgres deja DOS
      # series con el mismo name: la del id viejo, congelada en su último
      # scrape, y la del nuevo. Sin agregar, esto se evalúa serie por serie,
      # la vieja envejece hasta cruzar los 120s y dispara ~3 minutos después
      # del recreate, para resolverse sola a los 5 cuando Prometheus la marca
      # stale — todo con el contenedor corriendo y reportando al lado.
      # Pasó el 2026-08-10 15:04 UTC actualizando las imágenes de Postgres y
      # Traefik: las dos alertas salieron juntas y no había nada caído.
      # Colapsando por name gana siempre la serie fresca.
      #
      # La guarda de cadvisor cubre el falso positivo simétrico: si se cae el
      # que mide, todas las series quedan stale a la vez y esto avisaría de
      # contenedores caídos que están perfectos. Ese caso lo reporta
      # CadvisorCaido, abajo, en vez de disfrazarse de otra cosa.
      - alert: ContenedorCriticoCaido
        expr: >
          (time() - max by (name) (container_last_seen{name=~"traefik-traefik-1|dermicapro-data-postgres-1"})) > 120
          and on() (up{job="cadvisor"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "El contenedor {{ $labels.name }} dejó de reportar hace más de 2 minutos"
          description: "Ni Traefik ni Postgres deberían desaparecer nunca por sí solos — no son parte del ciclo de deploy."

      # Releva a la regla de arriba en el punto exacto donde se rinde. Si un
      # contenedor desaparece y NO vuelve, a los 5 minutos Prometheus se lleva
      # la serie del todo: `max by (name) (...)` se queda sin vector, la
      # expresión no devuelve nada y la alerta se resuelve sola con el
      # contenedor muerto. Para Postgres eso lo tapa PostgresCaido, que lee
      # pg_up del exporter y es una fuente independiente de cadvisor. Traefik
      # no tenía segunda fuente.
      #
      # Y no la tiene por ningún lado: todos los targets de prometheus.yml
      # apuntan a 127.0.0.1:<puerto>, directos al exporter o —el backend— al
      # nginx del frontend. Ninguno pasa por traefik, que solo termina el :443
      # que viene de internet. Con traefik caído, BackendCaido y PostgresCaido
      # siguen en verde porque sus targets responden igual, y
      # TasaErroresHTTPAlta tampoco dispara: sin peticiones entrando el rate se
      # va a cero y no hay 5xx que contar. O sea que pasados esos 5 minutos el
      # dominio está caído y el monitoreo entero en verde. Esta regla no es un
      # extra: es el único aviso.
      #
      # `absent()` vale 1 justo cuando la serie deja de existir, así que las
      # dos reglas se turnan sin solaparse. Recrear traefik no la dispara: ahí
      # la serie vieja sigue publicada y la nueva ya apareció. Lleva la misma
      # guarda de cadvisor para no convertir "se cayó el que mide" en "se cayó
      # traefik".
      - alert: TraefikDesaparecido
        expr: >
          absent(container_last_seen{name="traefik-traefik-1"})
          and on() (up{job="cadvisor"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "El contenedor de Traefik ya no existe"
          description: "Sin traefik no entra tráfico por el :443 y el dominio está caído, aunque backend y base sigan sanos: sus targets no pasan por él. Revisar con `docker compose -p traefik -f traefik/reverse-proxy.docker-compose.yml ps`."

      # Sin esta regla, la guarda de arriba convierte "cadvisor caído" en
      # silencio: dejaríamos de vigilar contenedores sin que nadie se entere.
      # `up` se escribe siempre, también cuando el scrape falla, así que esto
      # no depende de que cadvisor alcance a reportar nada.
      - alert: CadvisorCaido
        expr: up{job="cadvisor"} == 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "cAdvisor no responde: sin métricas de contenedores"
          description: "Mientras esté caído, ContenedorCriticoCaido no puede disparar y los paneles de contenedores del dashboard quedan vacíos."

  - name: http
    rules:
      - alert: TasaErroresHTTPAlta
        expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Más del 5% de las requests al backend están devolviendo 5xx"
          description: "Proporción de errores 5xx en los últimos 5 minutos: {{ $value | humanizePercentage }}."

  - name: recursos
    rules:
      - alert: CPUAltaEnHost
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "CPU del servidor por encima del 85% durante 10 minutos"
          description: "CPU usada: {{ $value | printf \"%.1f\" }}%."

      - alert: MemoriaAltaEnHost
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Memoria del servidor por encima del 85% durante 10 minutos"
          description: "Memoria usada: {{ $value | printf \"%.1f\" }}%."

      - alert: DiscoAltoEnHost
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 85
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Disco del servidor por encima del 85%"
          description: "Con el disco lleno, Postgres y los backups dejan de poder escribir. Uso actual: {{ $value | printf \"%.1f\" }}%."

      - alert: CPUAltaEnContenedorApp
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name=~"sugerencias-chat-.*-(backend|frontend)-1"}[5m])) * 100 > 80
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "{{ $labels.name }} usando más del 80% de un núcleo de CPU durante 10 minutos"
