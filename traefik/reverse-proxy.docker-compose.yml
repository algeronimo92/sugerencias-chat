services:
  traefik:
    # Fijado a propósito. Con "latest", un `up -d` cualquiera podía traer una
    # versión mayor y cambiar el enrutado sin que nadie lo pidiera — algo que
    # importa más ahora que el despliegue depende de que traefik conmute bien.
    image: traefik:3.7.10
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Proveedor de archivo: es lo que hace posible el blue-green. Las
      # etiquetas de Docker son inmutables, así que cambiar de color con
      # etiquetas obligaría a recrear contenedores — justo lo que se quiere
      # evitar. Traefik relee este directorio en caliente, de modo que
      # conmutar el tráfico es reescribir un archivo.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    env_file:
      - .env
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # En sólo lectura: traefik nunca escribe aquí, sólo observa. Quien
      # reescribe el archivo es scripts/deploy-bluegreen.sh, desde el host.
      - ./dynamic:/dynamic:ro

volumes:
  traefik-letsencrypt:
