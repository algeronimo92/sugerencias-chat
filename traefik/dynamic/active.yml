# Color activo del despliegue. Este archivo es el interruptor: traefik lo
# relee en caliente y el tráfico cambia de instancia sin recrear un solo
# contenedor.
#
# No editar a mano salvo para revertir de urgencia. Lo reescribe
# backend/scripts/deploy-bluegreen.sh, que antes comprueba que el color
# nuevo responde sano.
#
# Para revertir al instante: cambiar el puerto de la línea `url` por el del
# otro color (blue 8081, green 8082) y guardar. Traefik conmuta en menos de
# un segundo, sin reconstruir nada.
#
# ACTIVE_COLOR: green

http:
  routers:
    sugerencias-chat:
      # Un `Host()` fijo servía a un solo negocio: con multitenancy, el
      # subdominio de cada cliente ni llegaba al backend porque traefik
      # respondía 404 antes. La regex está acotada al dominio base a
      # propósito — abierta, traefik aceptaría cualquier Host y se lo pasaría
      # al backend.
      #
      # Sintaxis de traefik 3.x: regex estándar de Go. El formato con llaves
      # de la v2 (`{sub:[a-z]+}`) ya no se interpreta.
      rule: "HostRegexp(`^[a-z0-9-]+\\.cliniventas\\.com$`)"
      entryPoints:
        - websecure
      service: sugerencias-chat
      tls:
        certResolver: letsencrypt
        # Traefik no puede deducir qué dominios certificar a partir de una
        # HostRegexp: sin esta lista no pide ninguno y sirve su certificado por
        # defecto.
        #
        # Un único wildcard, emitido por DNS-01 (ver
        # reverse-proxy.docker-compose.yml), cubre el CRM de cada negocio y el
        # panel de plataforma: un negocio nuevo no se agrega acá. Cubre un solo
        # nivel, igual que la regla de arriba. No va el dominio raíz: un
        # wildcard no cubre el dominio al que pertenece, y cliniventas.com es
        # la landing, con su propio router y su propio certificado
        # (landing.yml). `www` también encaja en la regla de arriba; landing.yml
        # se lo queda por prioridad.
        #
        # El DNS ya tiene un registro `*` hacia el VPS, así que un subdominio
        # nuevo resuelve sin pasar por hPanel.
        domains:
          - main: "*.cliniventas.com"

  services:
    sugerencias-chat:
      loadBalancer:
        servers:
          # blue = 8081, green = 8082. Cada color publica su nginx sólo en
          # la interfaz de loopback, así que este puerto no es alcanzable
          # desde Internet: únicamente traefik llega a él.
          - url: "http://127.0.0.1:8082"
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s
