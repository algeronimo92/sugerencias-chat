name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      # Smoke test: la app tiene que poder importarse sin tocar una DB o n8n real.
      - run: |
          DATABASE_URL="postgresql+asyncpg://u:p@localhost/db" \
          N8N_WEBHOOK_URL="https://example.com/webhook/x" \
          SECRET_KEY="ci-smoke-test-key" \
          python -c "import main"
      # config.py construye Settings() al importarse, y sin .env en el runner
      # esas dos variables son obligatorias. Ningún test toca PostgreSQL real:
      # usan dobles, y el 401 de media ocurre antes de consultar la base.
      - name: Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
          N8N_WEBHOOK_URL: "https://example.com/webhook/x"
          SECRET_KEY: "ci-test-key"
        run: python -m pytest

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend-check ./backend
      - name: Build frontend image (prod target)
        run: docker build -t frontend-check --target prod --build-arg VITE_API_BASE_URL="" ./frontend
      # nginx.conf tiene "proxy_pass http://backend:8000;" — nginx resuelve ese
      # hostname ya al cargar la config, así que validarlo aislado (sin un
      # contenedor "backend" real en la misma red) siempre falla con "host
      # not found in upstream", sin que eso diga nada sobre si el config
      # está bien. Se arma la misma topología que docker-compose en prod:
      # una red con un "backend" de mentira, y ahí sí se valida.
      - name: Verify nginx.conf against a real "backend" hostname
        run: |
          docker network create ci-net
          docker run -d --name backend --network ci-net python:3.12-slim python -m http.server 8000
          docker run -d --name frontend --network ci-net frontend-check
          sleep 2
          docker exec frontend nginx -t
          docker ps --filter name=frontend --filter status=running --format '{{.Names}}' | grep -qx frontend
      - name: Cleanup check containers
        if: always()
        run: |
          docker rm -f backend frontend 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  # Un config de monitoreo roto no rompe la app, así que nadie se entera hasta
  # que hace falta una alerta que ya no existe. Se valida acá, contra las
  # mismas versiones que fija compose.monitoring.yml: validar con otra versión
  # no dice nada sobre la que después va a cargar el archivo.
  monitoring-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `check config` sigue los rule_files, así que esto valida también
      # alert-rules.yml. La ruta del mount es la misma que en prod porque
      # prometheus.yml los referencia por ruta absoluta (/etc/prometheus).
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager config
        run: |
          # url_file apunta al secreto del webhook, que no existe en el runner
          # (ni debe). Se monta uno de mentira para que la validación mire la
          # sintaxis del config y no el entorno donde corre.
          mkdir -p /tmp/am-secrets
          echo 'https://example.invalid/webhook' > /tmp/am-secrets/n8n_webhook_url
          docker run --rm \
            -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            -v /tmp/am-secrets:/etc/alertmanager-secrets:ro \
            --entrypoint amtool prom/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Loki config
        run: |
          # El config declara path_prefix /loki, que en prod es el volumen de
          # datos. Se le da un directorio escribible para que un fallo acá sea
          # por el config y no porque el runner no tiene esa ruta.
          mkdir -p /tmp/loki-data && chmod 777 /tmp/loki-data
          docker run --rm \
            -v "$PWD/monitoring/loki:/etc/loki:ro" -v /tmp/loki-data:/loki \
            grafana/loki:3.7.6 -verify-config -config.file=/etc/loki/loki-config.yml

  deploy:
    needs: [frontend-checks, backend-checks, docker-build-check, monitoring-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.VPS_PROJECT_PATH }}

            COMPOSE_DB="docker compose -f compose.db.yml --env-file db/.env"

            # Se guarda antes de mover nada: es el punto al que se vuelve si el
            # despliegue no llega a completarse. Con blue-green no hace falta
            # recrear nada para revertir — el color que servía nunca se toca
            # mientras el nuevo se prueba (ver deploy-bluegreen.sh) — esto solo
            # deja el repositorio en el commit conocido-bueno para el próximo
            # intento.
            PREVIOUS=$(git rev-parse HEAD)
            echo "Versión en curso: $PREVIOUS"

            # Comprobaciones previas. Van ANTES del git reset a propósito: lo
            # que miran no viene del repositorio sino del servidor, así que ya
            # se puede saber. Si falta algo, producción se queda intacta y con
            # el repositorio todavía en $PREVIOUS, no a medio camino.
            #
            # PostgreSQL arranca con ssl=on sin interruptor, así que sin
            # certificado entra en bucle de reinicio con "could not load server
            # certificate file: no start line" — un mensaje que no dice qué
            # hacer. db/tls/ está en .gitignore: lo genera cada servidor.
            if [ ! -s db/tls/server.crt ] || [ ! -s db/tls/server.key ]; then
              echo "ERROR: faltan los certificados TLS de PostgreSQL." >&2
              echo "La base no arranca sin ellos. Generarlos en el servidor con:" >&2
              echo "    scripts/gen-db-tls.sh" >&2
              exit 1
            fi

            # db/pg_hba.conf rechaza toda conexión de red sin cifrar, incluida
            # la del propio backend. Si backend/.env se quedó en
            # DATABASE_SSL=disable, el backend pierde la base en cuanto se
            # recrea PostgreSQL — y revertir no lo arregla, porque devuelve el
            # código pero no el pg_hba que la base ya cargó.
            if ! grep -qE '^[[:space:]]*DATABASE_SSL[[:space:]]*=[[:space:]]*require[[:space:]]*$' backend/.env; then
              echo "ERROR: backend/.env no tiene DATABASE_SSL=require." >&2
              echo "pg_hba.conf exige TLS a toda conexión de red; sin esto el" >&2
              echo "backend no puede conectar. Corregirlo en el servidor." >&2
              exit 1
            fi

            # Un cambio de versión MAYOR de PostgreSQL no arranca sobre el
            # directorio de datos de la anterior: el contenedor nuevo entra en
            # bucle de reinicio con "database files are incompatible with
            # server" y revertir el commit no lo arregla, porque el volumen
            # sigue como estaba pero la aplicación ya lleva abajo desde el
            # `up -d`. compose.db.yml lo advierte en un comentario; esto es lo
            # que lo hace cumplir.
            #
            # El pin entrante se lee del commit remoto SIN traerlo al árbol de
            # trabajo, para que un corte aquí deje el repositorio todavía en
            # $PREVIOUS, igual que el resto de comprobaciones previas.
            git fetch origin main
            PG_NUEVO=$(git show origin/main:compose.db.yml \
              | sed -n 's/^[[:space:]]*image:[[:space:]]*postgres:\([0-9]\{1,\}\).*/\1/p' \
              | head -1)
            # Falla cerrado si el pin dejó de ser legible —una variable, otro
            # formato—, que es justo cuando conviene que alguien mire. El `head`
            # final también garantiza salida 0: con un `grep` pelado, `set -e`
            # mataría el script en esta asignación y sin ningún mensaje.
            if [ -z "$PG_NUEVO" ]; then
              echo "ERROR: no se pudo leer la versión de postgres en compose.db.yml." >&2
              echo "Se esperaba una línea 'image: postgres:<mayor>...'. Si cambió" >&2
              echo "el formato, hay que actualizar esta comprobación en ci-cd.yml." >&2
              exit 1
            fi

            # La versión viva se le pregunta al directorio de datos, que es lo
            # que de verdad tiene que ser compatible. El tag de la imagen
            # mentiría si alguien ya subió el pin y el contenedor está
            # reiniciándose: diría la versión nueva sobre datos viejos. Si el
            # contenedor no responde se cae al tag, y si no hay contenedor no
            # hay nada que proteger —primer despliegue, o base apagada— y se
            # sigue adelante.
            PG_CID=$($COMPOSE_DB ps -q postgres 2>/dev/null | head -1)
            PG_VIVO=""
            if [ -n "$PG_CID" ]; then
              PG_VIVO=$(docker exec "$PG_CID" cat /var/lib/postgresql/data/PG_VERSION 2>/dev/null \
                | cut -d. -f1 | tr -dc '0-9')
              if [ -z "$PG_VIVO" ]; then
                PG_VIVO=$(docker inspect -f '{{.Config.Image}}' "$PG_CID" 2>/dev/null \
                  | sed -n 's/^postgres:\([0-9]\{1,\}\).*/\1/p' | head -1)
              fi
            fi

            if [ -z "$PG_CID" ]; then
              echo "No hay contenedor de PostgreSQL: no se comprueba compatibilidad."
            elif [ -z "$PG_VIVO" ]; then
              # Se distingue de la rama anterior a propósito: decir "no hay
              # PostgreSQL corriendo" cuando sí lo hay manda a buscar el
              # problema al lado equivocado.
              echo "AVISO: hay PostgreSQL corriendo pero no se pudo leer su versión." >&2
              echo "AVISO: se sigue sin comprobar compatibilidad." >&2
            elif [ "$PG_NUEVO" != "$PG_VIVO" ]; then
              echo "ERROR: este despliegue cambiaría PostgreSQL $PG_VIVO -> $PG_NUEVO." >&2
              echo "El contenedor nuevo NO puede arrancar sobre los datos de $PG_VIVO." >&2
              echo "Producción se queda intacta y el repositorio en $PREVIOUS." >&2
              echo "Una actualización mayor se hace a mano y con la app parada:" >&2
              echo "copia de seguridad (scripts/db-backup.sh), restaurar en la" >&2
              echo "versión nueva, verificar, y recién entonces subir el pin." >&2
              exit 1
            else
              echo "PostgreSQL $PG_VIVO, sin cambio de versión mayor."
            fi

            # traefik/dynamic/active.yml está versionado, pero en el servidor
            # es estado de ejecución: es el interruptor que dice qué color
            # sirve ahora. Un `git reset --hard` lo devuelve al color que
            # quedó commiteado, y traefik lo relee en caliente: si ese color
            # está apagado —lo normal, porque el despliegue anterior lo bajó—
            # el dominio queda sin backend hasta que el script vuelve a
            # escribirlo. Pasó con dos pushes seguidos a main.
            ACTIVE=traefik/dynamic/active.yml
            cp "$ACTIVE" /tmp/active.yml.deploy

            # El fetch ya se hizo arriba, para el guard de PostgreSQL.
            git reset --hard origin/main
            echo "Desplegando: $(git rev-parse HEAD)"

            cp /tmp/active.yml.deploy "$ACTIVE"

            # Qué va a recrear este despliegue, dicho antes de hacerlo.
            #
            # Son avisos, no comprobaciones: no hay nada que impedir aquí. Los
            # `up -d` de traefik y de la base corren en TODOS los despliegues
            # —a diferencia del monitoreo, que está detrás de una puerta más
            # abajo—, así que un commit que cambie esos archivos recrea
            # infraestructura de producción aunque venga con otro asunto. Pasó
            # el 2026-08-10: f0c4a8d se anunciaba como una actualización del
            # stack de monitoreo y traía también los pins de PostgreSQL y de
            # traefik. Se recrearon los dos, que era lo correcto, pero la
            # explicación hubo que reconstruirla después a base de
            # `docker inspect` y marcas de tiempo de los pull.
            #
            # Se mira el diff del archivo y no el tag de la imagen porque
            # cambiar un flag del `command:` o un volumen recrea el contenedor
            # igual. Un cambio que resulte ser solo de comentarios avisa sin
            # que haya recreate: en una línea de log el falso positivo no
            # cuesta nada, y lo caro es el silencio.
            if ! git diff --quiet "$PREVIOUS" HEAD -- traefik/reverse-proxy.docker-compose.yml; then
              echo "AVISO: cambió la configuración de traefik; este despliegue lo recrea."
              echo "AVISO: habrá un corte de ~10 s en :443 mientras vuelve a atar el puerto."
            fi

            # La base no se corta por esto —el guard de más arriba ya descartó
            # el único cambio del que no se vuelve, el de versión mayor—, pero
            # recrearla sí tira las conexiones abiertas del backend.
            if ! git diff --quiet "$PREVIOUS" HEAD -- compose.db.yml; then
              echo "AVISO: cambió compose.db.yml; este despliegue recrea PostgreSQL."
              echo "AVISO: el backend perderá las conexiones abiertas mientras rearranca."
            fi

            # Traefik, con la configuración de este repositorio. El contenedor
            # que había se levantó antes del blue-green: sin
            # --providers.file.directory, de modo que active.yml no enrutaba
            # nada y el único router del dominio era el del stack heredado, por
            # etiquetas. Así ningún despliegue llegaba a servirse nunca.
            #
            # -p traefik es el proyecto con el que ya está creado: mantiene el
            # volumen traefik_traefik-letsencrypt y con él el certificado. Sin
            # ese nombre se crearía un segundo traefik que ni siquiera podría
            # atar el :443 que tiene el primero.
            #
            # `up -d` es idempotente: sólo recrea el contenedor cuando la
            # imagen o los argumentos cambian.
            if [ ! -s traefik/.env ]; then
              echo "ERROR: falta traefik/.env (ACME_EMAIL)." >&2
              echo "Copiar traefik/.env.example y completarlo en el servidor." >&2
              exit 1
            fi
            docker compose -p traefik \
              -f traefik/reverse-proxy.docker-compose.yml \
              --env-file traefik/.env up -d

            # scripts/deploy-bluegreen.sh levanta el color inactivo al lado del
            # que sirve, migra (scripts/migrate.py toma un advisory lock, así
            # que si algún día hay más de una instancia sólo una aplica el DDL)
            # y comprueba /health/ready + el camino completo traefik -> nginx ->
            # SPA en el color nuevo, todo ANTES de tocar el tráfico. Si algo
            # falla ahí, el color activo nunca se enteró y no hace falta
            # revertir nada del lado de los contenedores.
            #
            # La base va aparte porque el script no la administra: crea la red
            # `dermicapro-data`, que compose.prod.yml declara como external.
            # Sin ella, levantar la aplicación falla con "network declared as
            # external, but could not be found". Es idempotente: si ya está
            # arriba, no hace nada.
            if $COMPOSE_DB up -d && ./scripts/deploy-bluegreen.sh; then
              echo "Despliegue verificado"

              # Monitoreo. Va DESPUÉS de que la app quedó servida y dentro de
              # la rama de éxito a propósito: si algo de acá falla, el script
              # corta con set -eu y el workflow queda en rojo, pero no entra a
              # la rama de rollback, así que la app desplegada no se revierte
              # por un problema del stack que la observa.
              #
              # Solo se toca cuando cambió algo suyo: recrear Prometheus o Loki
              # en cada push de la app dejaría huecos en métricas y logs sin
              # ninguna razón.
              if git diff --quiet "$PREVIOUS" HEAD -- monitoring compose.monitoring.yml; then
                echo "Monitoreo sin cambios, no se toca."
              else
                if [ ! -s monitoring/.env ]; then
                  echo "ERROR: falta monitoring/.env (GRAFANA_ADMIN_PASSWORD," >&2
                  echo "POSTGRES_EXPORTER_DSN). Ver scripts/monitoring-setup.sh." >&2
                  exit 1
                fi
                COMPOSE_MON="docker compose -f compose.monitoring.yml --env-file monitoring/.env"

                # Cubre lo que cambia de imagen o de argumentos. NO cubre el
                # contenido de los configs montados: para compose el servicio
                # sigue igual y no lo recrea. Eso se resuelve abajo, servicio
                # por servicio, porque cada uno recarga distinto.
                $COMPOSE_MON up -d

                # Prometheus y Alertmanager releen con SIGHUP, pero si el
                # config nuevo es inválido lo loguean y SIGUEN sirviendo el
                # anterior: el SIGHUP no falla y el deploy se iría en verde con
                # las reglas viejas cargadas. De ahí las dos comprobaciones,
                # antes y después. La de después mira la métrica que expone el
                # propio proceso, que es el estado real en memoria y no lo que
                # haya en el disco.
                esperar_reload() { # $1=puerto $2=prefijo métrica $3=nombre $4=timestamp previo
                  i=0
                  while [ "$i" -lt 15 ]; do
                    m=$(curl -sf "http://127.0.0.1:$1/metrics" || true)
                    ok=$(printf '%s\n' "$m" | awk -v p="$2_config_last_reload_successful" '$1==p{print $2}')
                    ts=$(printf '%s\n' "$m" | awk -v p="$2_config_last_reload_success_timestamp_seconds" '$1==p{print $2}')
                    if [ "$ok" = "1" ] && [ "$ts" != "$4" ]; then
                      echo "$3: config nuevo cargado."
                      return 0
                    fi
                    i=$((i + 1))
                    sleep 1
                  done
                  echo "ERROR: $3 no aplicó el config nuevo y sigue con el anterior." >&2
                  echo "Ver 'docker logs monitoring-$3-1' para el error de parseo." >&2
                  return 1
                }
                leer_ts() { # $1=puerto $2=prefijo métrica
                  curl -sf "http://127.0.0.1:$1/metrics" |
                    awk -v p="$2_config_last_reload_success_timestamp_seconds" '$1==p{print $2}'
                }

                if ! git diff --quiet "$PREVIOUS" HEAD -- monitoring/prometheus; then
                  docker exec monitoring-prometheus-1 promtool check config /etc/prometheus/prometheus.yml
                  ANTES=$(leer_ts 9090 prometheus)
                  docker kill -s HUP monitoring-prometheus-1
                  esperar_reload 9090 prometheus prometheus "$ANTES"
                fi

                if ! git diff --quiet "$PREVIOUS" HEAD -- monitoring/alertmanager; then
                  docker exec monitoring-alertmanager-1 amtool check-config /etc/alertmanager/alertmanager.yml
                  ANTES=$(leer_ts 9093 alertmanager)
                  docker kill -s HUP monitoring-alertmanager-1
                  esperar_reload 9093 alertmanager alertmanager "$ANTES"
                fi

                # Loki no recarga en caliente: hay que recrearlo. --force-recreate
                # porque `up -d` a secas no lo tocaría, ya que para compose no
                # cambió nada. Es el caso que documenta compose.monitoring.yml:
                # sin esto los arreglos de config no llegan nunca al proceso.
                if ! git diff --quiet "$PREVIOUS" HEAD -- monitoring/loki; then
                  $COMPOSE_MON up -d --force-recreate loki
                  i=0
                  until curl -sf http://127.0.0.1:3100/ready >/dev/null; do
                    i=$((i + 1))
                    if [ "$i" -ge 30 ]; then
                      echo "ERROR: Loki no volvió a /ready tras recrearlo." >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  echo "loki: recreado y listo."
                fi

                # Alloy y Grafana, por la misma razón que Loki. Los dashboards
                # de monitoring/dashboards/ no entran acá: Grafana los relee
                # solo, es el provisioning de datasources el que se aplica al
                # arrancar. Alloy guarda las posiciones en su volumen, así que
                # recrearlo no relee logs desde cero.
                if ! git diff --quiet "$PREVIOUS" HEAD -- monitoring/alloy; then
                  $COMPOSE_MON up -d --force-recreate alloy
                fi
                if ! git diff --quiet "$PREVIOUS" HEAD -- monitoring/grafana; then
                  $COMPOSE_MON up -d --force-recreate grafana
                fi
              fi

              # Se conservan las imágenes de la última semana: son las que
              # permiten revertir sin reconstruir desde cero.
              docker image prune -f --filter "until=168h"
            else
              echo "El despliegue no llegó a conmutar. El color que servía sigue activo sin cambios."
              echo "Dejando el repositorio en $PREVIOUS para el próximo intento."
              # El script ya dejó active.yml apuntando al color que sirve; se
              # vuelve a poner por la misma razón que arriba, para que volver
              # atrás el código no mueva el tráfico.
              cp "$ACTIVE" /tmp/active.yml.serving
              git reset --hard "$PREVIOUS"
              cp /tmp/active.yml.serving "$ACTIVE"
              exit 1
            fi
