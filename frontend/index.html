<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Manifest del negocio (nombre, color e ícono propios), resuelto por dominio. -->
    <link rel="manifest" href="/api/branding/manifest.webmanifest" />
    <!-- viewport-fit=cover: en la PWA instalada la app se dibuja debajo de la
         barra de estado y de la barra de gestos; el margen real lo ponen las
         utilidades pt-safe / pb-safe con env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-title" content="CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Se funde con el header de la app: verde wa-primary-strong en claro, wa-head-dark en oscuro.
         El tema es un toggle manual (localStorage), así que el script de abajo y useTheme
         mantienen este meta sincronizado; el valor inicial es solo fallback sin JS.
         Safari 26+ lo ignora y muestrea el background del <body> (ver index.css);
         Chrome Android y la PWA instalada sí lo usan. -->
    <meta name="theme-color" content="#008069" />
    <title>CRM</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
        // Marca del negocio guardada en la visita anterior (ver src/branding.ts):
        // se aplica antes del primer frame para no mostrar otra marca un instante.
        var strong = '#008069'
        try {
          var brand = JSON.parse(localStorage.getItem('brand') || 'null')
          if (brand && location.pathname.indexOf('/platform') !== 0) {
            if (brand.name) document.title = brand.name
            if (brand.icon_url) document.querySelector('link[rel="icon"]').setAttribute('href', brand.icon_url)
            // El verde de la plataforma ya está en index.css con sus tonos exactos.
            if (/^#[0-9a-f]{6}$/i.test(brand.primary_color) && brand.primary_color.toLowerCase() !== '#00a884') {
              var shade = function (factor) {
                return '#' + [1, 3, 5].map(function (i) {
                  return ('0' + Math.round(parseInt(brand.primary_color.slice(i, i + 2), 16) * factor).toString(16)).slice(-2)
                }).join('')
              }
              strong = shade(0.76)
              var root = document.documentElement.style
              root.setProperty('--color-wa-primary', brand.primary_color)
              root.setProperty('--color-wa-primary-strong', strong)
              root.setProperty('--color-wa-primary-deep', shade(0.655))
            }
          }
        } catch (e) {}
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', isDark ? '#202c33' : strong)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
