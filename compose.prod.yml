services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    # La base vive en docker-compose.db.yml, en su propio proyecto, y se
    # alcanza por esta red compartida. Ver ese archivo para el porqué.
    networks:
      - default
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  # La crea docker-compose.db.yml. `external` obliga a que la base esté
  # levantada antes que la aplicación, en vez de crear una red vacía en la que
  # el backend no encontraría a nadie.
  data:
    name: dermicapro-data
    external: true
