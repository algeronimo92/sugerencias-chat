# PostgreSQL propio del proyecto.
#
# Va en su propio archivo y en su propio proyecto de compose, no dentro de
# compose.prod.yml, por dos razones:
#
# 1. El despliegue blue-green levanta la aplicación como dos proyectos
#    distintos (sugerencias-chat-blue y -green). Si la base viviera ahí dentro,
#    cada color arrancaría *su propia* base vacía y el tráfico saltaría entre
#    dos conjuntos de datos distintos.
# 2. Los datos deben sobrevivir a cualquier `down` de la aplicación. Separando
#    el ciclo de vida, un despliegue no puede tocarlos ni por accidente.
#
# Se levanta una sola vez por servidor:
#
#   docker compose -f compose.db.yml --env-file db/.env up -d
#
# Y NO se expone ningún puerto al host: se llega por la red `dermicapro-data`,
# a la que se suman la aplicación y n8n. Publicar 5432 fue exactamente lo que
# dejó la base anterior accesible desde Internet.

name: dermicapro-data

services:
  postgres:
    # Fijada por versión: una actualización mayor de PostgreSQL no arranca
    # sobre un directorio de datos de la versión anterior, y con `latest` eso
    # ocurriría en el peor momento, sin avisar.
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      # UTF8 explícito: el CRM guarda nombres con acentos y mensajes con emoji.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # TLS obligatorio, sin interruptor: la base no arranca sin certificado.
    #
    # Es deliberado que falle cerrado. Un TLS opcional se queda apagado el dia
    # que alguien despliega con prisa, y aqui viajan conversaciones de
    # pacientes. Si falta el certificado, el despliegue se detiene con un
    # mensaje que dice que ejecutar (ver el paso "certificados" en ci-cd.yml).
    #
    # Los genera scripts/gen-db-tls.sh.
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/postgres/tls/server.crt
      -c ssl_key_file=/etc/postgres/tls/server.key
      -c hba_file=/etc/postgres/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Copias de seguridad accesibles desde el host, para poder llevárselas
      # fuera del servidor. Un backup que sólo vive en la misma máquina no
      # protege del caso que ya ocurrió.
      - ./db/backups:/backups
      # Certificado, clave y reglas de acceso, en solo lectura: PostgreSQL no
      # debe poder reescribir quien tiene permiso para entrar.
      #
      # Se monta el directorio entero y no cada archivo por separado: si se
      # montara ./db/tls/server.crt y ese archivo aun no existe, Docker crea un
      # DIRECTORIO con ese nombre y PostgreSQL falla con un error que no apunta
      # a la causa.
      - ./db/tls:/etc/postgres/tls:ro
      - ./db/pg_hba.conf:/etc/postgres/pg_hba.conf:ro
    healthcheck:
      # `pg_isready` sin más responde antes de que la base acepte consultas
      # reales; se pregunta por la base concreta.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Por defecto no se publica nada: solo llegan los contenedores de la red
    # `dermicapro-data`, en esta misma maquina.
    #
    # n8n corre en otra VPS, asi que necesita un camino. POSTGRES_BIND_IP debe
    # ser la IP PRIVADA de este host (la de la red interna entre tus VPS), no
    # 0.0.0.0: atado a todas las interfaces, el puerto queda expuesto a
    # Internet, que es exactamente como acabo la base anterior.
    #
    #   POSTGRES_BIND_IP=10.0.0.5   -> escucha solo en la red privada
    #   sin definir                 -> no escucha fuera de Docker
    #
    # Si no hay red privada disponible y hay que salir por la publica, hay que
    # habilitar TLS en PostgreSQL y subir DATABASE_SSL a "require": si no, las
    # credenciales y el contenido de los mensajes viajan en claro.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    networks:
      data:
        aliases:
          - postgres
    # Un PostgreSQL que se queda sin memoria mata consultas a media
    # transacción; se le reserva un mínimo predecible.
    shm_size: 256mb

volumes:
  pgdata:
    # Nombre explícito para que sea reconocible en `docker volume ls` y no
    # dependa del nombre del proyecto. AQUI VIVEN LOS DATOS: un
    # `docker compose down -v` lo borra.
    name: dermicapro-pgdata

networks:
  data:
    name: dermicapro-data
