services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    restart: unless-stopped
    volumes:
      # Red de seguridad para MEDIA_STORAGE_BACKEND=local. Sin esto los
      # archivos viven dentro del contenedor y cada despliegue blue-green los
      # borra al recrearlo. Es un bind mount y no un volumen con nombre a
      # propósito: compose prefija los volúmenes con el nombre del proyecto, y
      # blue y green son proyectos distintos, así que cada color tendría el
      # suyo y no verían los archivos del otro.
      #
      # Con MEDIA_STORAGE_BACKEND=minio —lo recomendado— queda sin usar.
      - ./data/media:/app/media
    # La base vive en compose.db.yml, en su propio proyecto, y se
    # alcanza por esta red compartida. Ver ese archivo para el porqué.
    networks:
      - default
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8000:8000"
    environment:
      # Los workers de fondo corren en el servicio `worker`: la API atiende
      # HTTP, WebSocket y los recordatorios de tareas (que dependen de sus
      # propias conexiones). Ver app/runtime.py.
      RUN_WORKERS: "false"

  worker:
    # Misma imagen que la API, otro proceso: chats, automatizaciones,
    # outbox, programados y el inbox de Meta. Los avisos que emite llegan al
    # navegador por LISTEN/NOTIFY, a través de la réplica de la API a la que
    # esté conectado (app/db/signals.py).
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./backend/.env
    environment:
      # Sus métricas (envíos, colas) las sirve en este puerto; el nginx del
      # frontend las expone a Prometheus en /worker-metrics.
      WORKER_METRICS_PORT: "9000"
    restart: unless-stopped
    volumes:
      - ./data/media:/app/media
    networks:
      - default
      - data
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

networks:
  # La crea compose.db.yml. `external` obliga a que la base esté
  # levantada antes que la aplicación, en vez de crear una red vacía en la que
  # el backend no encontraría a nadie.
  data:
    name: dermicapro-data
    external: true
