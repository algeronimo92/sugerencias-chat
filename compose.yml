# Desarrollo local autocontenido: PostgreSQL persistente, backend con
# hot-reload y frontend. Las credenciales de la base salen de db/.env; deben
# coincidir con las de DATABASE_URL en backend/.env.

services:
  postgres:
    image: postgres:16.14-alpine
    env_file:
      - ./db/.env
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    # Sólo loopback y en 5433 para no chocar con otro PostgreSQL instalado.
    # Los contenedores usan postgres:5432 por la red interna de Compose.
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    # En desarrollo la migración es parte del arranque: una base nueva queda
    # lista sola y una existente avanza bajo el advisory lock de migrate.py.
    command: >-
      sh -c "python -m scripts.migrate &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      # 127.0.0.1:5173 sumado junto a los de localhost: es el origen real
      # desde el que sirve el navegador ahora que el frontend se accede por
      # IPv4 explícito (ver el comentario en el servicio frontend).
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:5174","http://localhost:3000","http://127.0.0.1:5173"]
      # Mismo comodín que VITE_ALLOWED_HOSTS del frontend: el hostname del
      # túnel rápido de Cloudflare cambia en cada corrida.
      - CORS_ORIGIN_REGEX=https://.*\.trycloudflare\.com
      # La conexión no sale de la red Docker local. Producción conserva
      # DATABASE_SSL=require desde backend/.env y compose.prod.yml.
      - DATABASE_SSL=disable
      # El negocio local ya vive en su propio schema (ver
      # scripts/move_public_to_tenant.py): se entra por dermicapro.localhost,
      # no por localhost, que queda reservado como host de plataforma.
      - MULTITENANCY_ENABLED=true
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vacío = rutas relativas (mismo comportamiento que producción, ver
      # api/client.ts): el navegador le habla al mismo origen que sirve la
      # app y es Vite quien reenvía /api, /media y /ws al backend por dentro
      # de la red de Docker (ver proxy en vite.config.ts). Necesario para que
      # la cookie de sesión sea same-origin sin importar si se entra por
      # localhost:5173 o por un túnel https -- apuntar directo a
      # 127.0.0.1:8000 desde un origen https rompía SameSite=Lax.
      - VITE_API_BASE_URL=
      # El comodín de subdominio cubre cualquier túnel rápido de Cloudflare
      # (cloudflared tunnel --url, hostname aleatorio en cada corrida) sin
      # tener que actualizar esto cada vez que se reinicia el túnel. Hace
      # falta para probar el Embedded Signup de Meta, que exige HTTPS.
      #
      # `.localhost` cubre los subdominios de los tenants locales: con
      # multitenancy el backend resuelve el negocio por el Host, y Vite reenvía
      # el original porque el proxy no usa changeOrigin.
      - VITE_ALLOWED_HOSTS=.trycloudflare.com,.localhost
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata-dev:
    # Nombre nuevo para no reutilizar volúmenes antiguos que puedan contener
    # app_settings cifrados con otra SETTINGS_ENCRYPTION_KEY. Los volúmenes
    # anteriores no se eliminan y pueden respaldarse o inspeccionarse aparte.
    name: sugerencias-chat_pgdata-local
