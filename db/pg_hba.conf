# Reglas de acceso de PostgreSQL. Gestionado por compose.db.yml (hba_file).
#
# Objetivo: la app y n8n-local llegan por la red interna de Docker sin cifrar;
# cualquier conexion desde Internet DEBE usar TLS (hostssl) y se rechaza en claro.
#
# TYPE      DATABASE  USER  ADDRESS         METHOD
local       all       all                   trust
host        all       all   127.0.0.1/32    scram-sha-256
host        all       all   ::1/128         scram-sha-256
# Red interna Docker (app y n8n-local en esta maquina): sin exigir SSL
host        all       all   172.16.0.0/12   scram-sha-256
# Internet: SSL obligatorio; rechazar cualquier conexion sin cifrar
hostssl     all       all   0.0.0.0/0       scram-sha-256
hostnossl   all       all   0.0.0.0/0       reject
