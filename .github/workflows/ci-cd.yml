name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      # Smoke test: la app tiene que poder importarse sin tocar una DB o n8n real.
      - run: |
          DATABASE_URL="postgresql+asyncpg://u:p@localhost/db" \
          N8N_WEBHOOK_URL="https://example.com/webhook/x" \
          SECRET_KEY="ci-smoke-test-key" \
          python -c "import main"
      # config.py construye Settings() al importarse, y sin .env en el runner
      # esas dos variables son obligatorias. Ningún test toca PostgreSQL real:
      # usan dobles, y el 401 de media ocurre antes de consultar la base.
      - name: Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
          N8N_WEBHOOK_URL: "https://example.com/webhook/x"
          SECRET_KEY: "ci-test-key"
        run: python -m pytest

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend-check ./backend
      - name: Build frontend image (prod target)
        run: docker build -t frontend-check --target prod --build-arg VITE_API_BASE_URL="" ./frontend
      # nginx.conf tiene "proxy_pass http://backend:8000;" — nginx resuelve ese
      # hostname ya al cargar la config, así que validarlo aislado (sin un
      # contenedor "backend" real en la misma red) siempre falla con "host
      # not found in upstream", sin que eso diga nada sobre si el config
      # está bien. Se arma la misma topología que docker-compose en prod:
      # una red con un "backend" de mentira, y ahí sí se valida.
      - name: Verify nginx.conf against a real "backend" hostname
        run: |
          docker network create ci-net
          docker run -d --name backend --network ci-net python:3.12-slim python -m http.server 8000
          docker run -d --name frontend --network ci-net frontend-check
          sleep 2
          docker exec frontend nginx -t
          docker ps --filter name=frontend --filter status=running --format '{{.Names}}' | grep -qx frontend
      - name: Cleanup check containers
        if: always()
        run: |
          docker rm -f backend frontend 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  deploy:
    needs: [frontend-checks, backend-checks, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.VPS_PROJECT_PATH }}

            COMPOSE="docker compose -f compose.prod.yml -f traefik/docker-compose.yml"
            COMPOSE_DB="docker compose -f compose.db.yml --env-file db/.env"

            # Se guarda antes de mover nada: es el punto al que se vuelve si la
            # versión nueva no llega a responder.
            PREVIOUS=$(git rev-parse HEAD)
            echo "Versión en curso: $PREVIOUS"

            # Comprobaciones previas. Van ANTES del git reset a propósito: lo
            # que miran no viene del repositorio sino del servidor, así que ya
            # se puede saber. Si falta algo, producción se queda intacta y con
            # el repositorio todavía en $PREVIOUS, no a medio camino.
            #
            # PostgreSQL arranca con ssl=on sin interruptor, así que sin
            # certificado entra en bucle de reinicio con "could not load server
            # certificate file: no start line" — un mensaje que no dice qué
            # hacer. db/tls/ está en .gitignore: lo genera cada servidor.
            if [ ! -s db/tls/server.crt ] || [ ! -s db/tls/server.key ]; then
              echo "ERROR: faltan los certificados TLS de PostgreSQL." >&2
              echo "La base no arranca sin ellos. Generarlos en el servidor con:" >&2
              echo "    scripts/gen-db-tls.sh" >&2
              exit 1
            fi

            # db/pg_hba.conf rechaza toda conexión de red sin cifrar, incluida
            # la del propio backend. Si backend/.env se quedó en
            # DATABASE_SSL=disable, el backend pierde la base en cuanto se
            # recrea PostgreSQL — y revertir no lo arregla, porque devuelve el
            # código pero no el pg_hba que la base ya cargó.
            if ! grep -qE '^[[:space:]]*DATABASE_SSL[[:space:]]*=[[:space:]]*require[[:space:]]*$' backend/.env; then
              echo "ERROR: backend/.env no tiene DATABASE_SSL=require." >&2
              echo "pg_hba.conf exige TLS a toda conexión de red; sin esto el" >&2
              echo "backend no puede conectar. Corregirlo en el servidor." >&2
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main
            echo "Desplegando: $(git rev-parse HEAD)"

            # El backend responde /health/ready sólo si alcanza PostgreSQL y el
            # almacenamiento multimedia, así que sirve de comprobación real y no
            # sólo de "el proceso arrancó". El start_period del healthcheck es de
            # 60 s; se concede el doble antes de dar el despliegue por fallido.
            wait_until_healthy() {
              i=0
              while [ $i -lt 40 ]; do
                if $COMPOSE exec -T backend python -c \
                     "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)" \
                     >/dev/null 2>&1; then
                  # Y de paso el camino completo: traefik -> nginx -> SPA.
                  # Va contra el 443 con --resolve, no contra el 80: traefik
                  # redirige http a https, así que una petición al 80 devuelve
                  # un 301 que curl da por bueno sin haber tocado nginx.
                  if curl -fsSk -o /dev/null \
                       --resolve chat.dermicapro.app:443:127.0.0.1 \
                       https://chat.dermicapro.app/; then
                    return 0
                  fi
                fi
                i=$((i + 1))
                sleep 5
              done
              return 1
            }

            # Las migraciones van antes de arrancar y en un contenedor aparte:
            # scripts/migrate.py toma un advisory lock, así que si algún día hay
            # más de una instancia sólo una aplica el DDL y el resto espera.
            # Si falla, no se arranca nada: mejor quedarse en la versión
            # anterior que servir con el esquema a medias.
            migrate() {
              # La base primero: crea la red `dermicapro-data`, que
              # compose.prod.yml declara como external. Sin ella, levantar la
              # aplicación falla con "network declared as external, but could
              # not be found" — un mensaje que no apunta a la causa. Es
              # idempotente: si ya está arriba, no hace nada.
              $COMPOSE_DB up -d && \
              $COMPOSE build backend && \
              $COMPOSE run --rm --no-deps backend python -m scripts.migrate
            }

            if migrate && $COMPOSE up -d --build && wait_until_healthy; then
              echo "Despliegue verificado"
              # Se conservan las imágenes de la última semana: son las que
              # permiten revertir sin reconstruir desde cero.
              docker image prune -f --filter "until=168h"
            else
              echo "El despliegue no respondió sano. Revirtiendo a $PREVIOUS"
              git reset --hard "$PREVIOUS"
              # La base también, no sólo la aplicación: migrate() ya recreó el
              # contenedor con el compose.db.yml y el pg_hba de la versión
              # nueva. Sin volver a aplicarlos, PostgreSQL se queda con la
              # configuración de la versión que acaba de fallar mientras el
              # código vuelve a la anterior — y esa pareja puede no hablarse.
              $COMPOSE_DB up -d
              # No se revierte el esquema: las migraciones son aditivas y el
              # código anterior convive con columnas de más. Un downgrade
              # automático sí podría destruir datos, así que se deja para una
              # decisión humana.
              $COMPOSE up -d --build
              if wait_until_healthy; then
                echo "Reversión completada: producción quedó en $PREVIOUS"
              else
                echo "ATENCIÓN: la reversión tampoco responde. Requiere intervención manual."
              fi
              exit 1
            fi
