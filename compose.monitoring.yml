# Observabilidad: Prometheus + Grafana + Loki + Alertmanager + exporters.
#
# Proyecto de compose propio y separado del deploy blue-green de la app:
# nada de esto se recrea, se apaga ni se ve afectado por
# scripts/deploy-bluegreen.sh.
#
# Todo corre en network_mode: host, igual que traefik
# (traefik/reverse-proxy.docker-compose.yml), y cada proceso se ata a
# 127.0.0.1 con su propio flag. Así ningún puerto de monitoreo queda
# expuesto a Internet aunque el host no tenga firewall — el único público es
# Grafana, y llega por Traefik (ver traefik/dynamic/grafana.yml), nunca por
# su puerto directo.
#
#   docker compose -f compose.monitoring.yml --env-file monitoring/.env up -d

name: monitoring

services:
  prometheus:
    # v3.13 es la LTS vigente (soporte hasta 2027-07-31); la anterior, 3.5,
    # venció el 2026-07-31. Se salta de 2.55 a 3.x de una:
    # los flags de acá (--config.file, --storage.tsdb.path,
    # --storage.tsdb.retention.time, --web.listen-address) siguen siendo
    # válidos, y monitoring/prometheus/prometheus.yml no usa nada que v3 quitó
    # (todos los targets llevan puerto explícito, así que la eliminación del
    # puerto por defecto no lo afecta).
    #
    # Lo único que sí cambia de comportamiento: v3 normaliza los valores de
    # `le`/`quantile` a float (le="1" pasa a ser le="1.0"). El panel p95 del
    # dashboard hace `sum by (le, handler)` sobre
    # http_request_duration_seconds_bucket, así que mientras convivan series
    # viejas y nuevas en la misma ventana de 5m va a mostrar un bache. Se
    # arregla solo cuando lo scrapeado con v2 salga de los 30d de retención.
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 84 GB libres en disco y una app chica: 30 días de métricas no pesa
      # nada acá. Ajustar si crece mucho.
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      # Se monta el directorio, no cada archivo: un bind-mount de archivo
      # suelto fija el inodo, y `git checkout`/`git pull` reemplazan el
      # archivo en vez de editarlo in-place, así que el contenedor se queda
      # sirviendo el contenido viejo indefinidamente y el SIGHUP recarga eso.
      # Pasó con alert-rules.yml (siguió con la alerta por acumulado tras
      # f8266a0) y con prometheus.yml (sin el override de `instance`).
      # El directorio es propio y no `./monitoring` porque ahí viven .env y
      # secrets/, que no tienen por qué entrar a este contenedor.
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus. El
      # archivo de adentro ahora está versionado y sin secreto: desde 0.28.0
      # el panic de `url_file` está arreglado (prometheus/alertmanager#3800),
      # así que la URL del webhook se lee del archivo montado abajo en vez de
      # hornearse con un script de render.
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      # El secreto, en su propio mount y también por directorio (mismo motivo
      # que el resto: reescribir el archivo en el host cambia el inodo y el
      # contenedor se quedaría leyendo el contenido viejo al rotar la URL).
      # No va anidado bajo /etc/alertmanager para no montar uno adentro del
      # otro. El directorio existe en git — trae el .example —, así que Docker
      # no puede crearlo vacío y de root en un clon nuevo.
      - ./monitoring/secrets:/etc/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager

  loki:
    # El config de monitoring/loki/loki-config.yml (common + filesystem + tsdb
    # schema v13) no necesitó cambios para el salto desde 3.2: los breaking
    # del camino son bloom blocks (no se usan), clientes Thanos (opt-in) y
    # AWS SDK v2 (no hay S3). Sí desapareció la shell de la imagen (3.5.8+,
    # por CVEs de busybox): ya no hay `docker exec ... sh` acá adentro.
    image: grafana/loki:3.7.6
    restart: unless-stopped
    network_mode: host
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus. Acá
      # muerde todavía más que en el resto, porque Loki no recarga config en
      # caliente: se lo recrea, y un `docker compose up -d` no recrea nada si
      # el único cambio es el contenido del archivo montado.
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki

  alloy:
    # Reemplaza a Promtail, EOL desde 2026-03-02 (sin más parches de
    # seguridad). monitoring/alloy/config.alloy se generó con `alloy convert
    # --source-format=promtail` a partir del viejo
    # monitoring/promtail-config.yml (borrado acá; está en git hasta 8201703),
    # así que el pipeline de labels es el mismo: container + stream.
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      # Alloy sirve su UI/API de debug en :12345 y por defecto bindea a
      # 0.0.0.0. Con network_mode: host eso la dejaría abierta a Internet
      # (el host no tiene firewall), así que va a loopback como el resto.
      - --server.http.listen-addr=127.0.0.1:12345
      # Acá viven las posiciones de lectura. Promtail las guardaba en
      # /tmp/positions.yaml dentro del contenedor y las perdía en cada
      # recreate, lo que causaba relectura de logs; el volumen las persiste.
      - --storage.path=/var/lib/alloy/data
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus.
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=127.0.0.1:9100

  cadvisor:
    # v0.49.1 (2024) no reconoce el layout de metadata de contenedores que
    # trae Docker 29: "failed to identify the read-write layer ID" en cada
    # contenedor, y container_memory_usage_bytes/etc. quedaban sin las
    # labels name/image (imposible filtrar por contenedor). De v0.55.1 en
    # adelante sí lo soporta.
    #
    # CAMBIA DE REGISTRO, no solo de tag: gcr.io/cadvisor/cadvisor no publica
    # nada después de v0.55.1 (el proyecto migró a GHCR en v0.56.0,
    # google/cadvisor#3806). Todo lo nuevo vive en ghcr.io/google/cadvisor.
    # v0.56.0 además dejó de soportar Docker < 25.0; este host corre 29.
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    network_mode: host
    # El HEALTHCHECK de la imagen se reescribió en v0.56.0
    # (google/cadvisor#3789): ahora deduce el puerto del flag --port —bien,
    # porque acá no es el 8080 por defecto— pero pega contra "localhost" y ya
    # no mira la variable CADVISOR_HEALTHCHECK_URL que se usaba antes.
    # /etc/hosts del contenedor resuelve "localhost" primero a ::1 y cadvisor
    # solo escucha en IPv4, así que el healthcheck de la imagen da siempre
    # "connection refused" y marca el contenedor unhealthy aunque responda
    # bien. Por eso se sobrescribe acá apuntando a 127.0.0.1 explícito.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9280/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --port=9280
      - --listen_ip=127.0.0.1

  postgres-exporter:
    # DATA_SOURCE_NAME, PG_EXPORTER_WEB_LISTEN_ADDRESS y pg_up no cambiaron
    # entre 0.15 y 0.20. Los renames de 0.20 son sobre pg_replication_slot*
    # (no se usa: instancia única, sin réplicas) y 0.16 cambió el formato de
    # los logs a slog, que es lo único visible en `docker logs`.
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    network_mode: host
    environment:
      # Generado por scripts/monitoring-setup.sh (rol de solo lectura
      # pg_monitor). sslmode=require porque db/pg_hba.conf exige TLS a toda
      # conexión de red.
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:?definir POSTGRES_EXPORTER_DSN en monitoring/.env, ver scripts/monitoring-setup.sh}
      - PG_EXPORTER_WEB_LISTEN_ADDRESS=127.0.0.1:9187

  grafana:
    # Se queda en la rama 12 y no salta a 13 a propósito: 12.4 sigue
    # recibiendo parches y es el salto más chico desde 11.3. La remoción de
    # Angular en 12.0 no afecta a monitoring/dashboards/ (solo usa stat,
    # timeseries y row, todos React) y Grafana migra su schemaVersion 39
    # hacia adelante al provisionarlo. `editors_can_admin`, también removido
    # en 12.0, no se usa acá.
    image: grafana/grafana:12.4.8
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://grafana.chat.dermicapro.app
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD en monitoring/.env}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      # Directorios y no archivos sueltos: ver el comentario en prometheus.
      # Se montan las dos carpetas hoja de provisioning y no provisioning/
      # entera para no tapar alerting/, plugins/ y demás que trae la imagen.
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboard-provider:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
