# Configuración de Alembic.
#
# El directorio se llama "alembic/" y no "migrations/" a propósito: ya existe
# backend/migrations/ con los .sql históricos que se aplicaban a mano, y
# mezclarlos haría ambiguo cuál es la fuente de verdad. Los .sql quedan como
# registro de lo que se hizo antes; a partir de aquí manda Alembic.
#
# La URL no se pone aquí: env.py la toma de config.settings, que ya sabe
# leer DATABASE_URL del entorno o del .env. Asi no hay dos sitios donde
# configurar la misma cadena, ni riesgo de commitear credenciales.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
