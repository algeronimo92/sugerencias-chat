# Traefik termina TLS y proxea a nginx en claro, así que $scheme vale "http"
# acá dentro. Se propaga el X-Forwarded-Proto original cuando existe para que
# el backend sepa que la petición del usuario sí fue https (de eso depende la
# marca `Secure` de la cookie de sesión). Sin Traefik delante, cae a $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # `backend` se resuelve en cada petición (DNS de Docker, 127.0.0.11) y no
    # una sola vez al arrancar nginx. Con `proxy_pass http://backend:8000`
    # literal, nginx guardaba la IP del arranque: el 2026-11-08 el frontend de
    # green quedó levantado de un deploy fallido, el deploy siguiente recreó
    # backend y worker, se intercambiaron las IPs y toda la API respondió 502
    # (nginx le hablaba al worker). Una variable obliga a resolver; sin URI
    # en proxy_pass, la petición sigue llegando con su URI original.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Readiness del backend a través de este nginx: es lo que comprueba el
    # deploy antes de conmutar (scripts/deploy-bluegreen.sh). Probar el
    # backend por su cuenta no detecta que el camino frontend → backend esté
    # roto, que fue exactamente la caída del 2026-11-08.
    location = /api/health/ready {
        proxy_pass $backend/health/ready;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ^~ evita que la regla regex de assets estáticos intercepte imágenes
    # del CRM (.jpg, .jpeg, .png, etc.) antes de enviarlas al backend.
    #
    # Sin `expires`/`add_header` acá: son contenido privado de clientes y el
    # backend ya responde `Cache-Control: private, max-age=3600`. Marcarlo
    # "public, immutable" durante 7 días lo dejaba cacheable por cualquier
    # proxy intermedio.
    location ^~ /media/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # El service worker y su registrador NO pueden quedar cacheados: si un
    # navegador se queda con un sw.js viejo la app deja de actualizarse sola.
    # Van con `location =` para ganarle a la regla regex de assets de abajo,
    # que si no los marcaría "immutable" por un año.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /registerSW.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # index.html tiene que revalidar siempre: es lo que apunta a los assets
    # con hash y al service worker nuevo. Sin esto un navegador puede quedarse
    # con el shell viejo aunque el deploy ya haya pasado.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Scrape de Prometheus. Server aparte y no una location en el de arriba a
# propósito: ese server lo alcanza tanto Traefik (dominio público) como el
# puerto publicado en loopback para el healthcheck de deploy-bluegreen.sh, y
# Docker hace NAT incluso en puertos atados a 127.0.0.1 — nginx ve todo el
# tráfico llegar desde la puerta de enlace del bridge, nunca desde loopback
# de verdad, así que un `allow 127.0.0.1` ahí no distingue nada (se probó y
# bloqueaba tanto a Prometheus como al dominio público). Este server escucha
# en un puerto que compose.bluegreen.yml publica en un ${METRICS_PORT}
# propio, al que Traefik jamás apunta (active.yml solo conoce ${COLOR_PORT}):
# nada que no sea una conexión directa a este puerto en el host puede
# llegar acá, así que no hace falta ACL además del bind a loopback.
server {
    listen 9113;
    server_name _;

    location = /metrics {
        # Resuelto en cada petición, como en el server de arriba.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_metrics http://backend:8000/metrics;
        proxy_pass $backend_metrics;
    }

    # Las métricas del proceso worker (python -m app.worker). Se resuelve al
    # pedirlas y no al arrancar: en las instalaciones de un solo proceso no
    # existe el servicio `worker` y nginx no puede negarse a arrancar por eso.
    location = /worker-metrics {
        resolver 127.0.0.11 valid=10s;
        set $worker_metrics http://worker:9000/metrics;
        proxy_pass $worker_metrics;
    }

    location / {
        return 404;
    }
}
