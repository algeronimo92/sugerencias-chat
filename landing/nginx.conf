# Sirve el export estático de la landing (`next build` con output: "export").
#
# Reemplaza al `.htaccess` con el que la landing vivía en el hosting compartido
# de Hostinger: cada regla de acá es la traducción de una de aquellas. Traefik
# termina TLS y redirige http -> https antes de llegar a este nginx, así que
# acá no hay nada de eso.

# Un solo `Cache-Control` por respuesta, decidido por la extensión de lo que
# se termina sirviendo ($uri ya es `/privacidad.html` cuando se pidió
# `/privacidad`). Va en un `map` y no en `add_header` dentro de cada
# `location` porque en nginx un `add_header` en una location descarta TODOS
# los heredados del server: las cabeceras de seguridad de abajo desaparecerían
# justo en las respuestas que más importan.
map $uri $cache_control {
    # El HTML y los .txt de navegación NO se cachean: es lo que hace que un
    # despliegue se vea de inmediato.
    ~*\.(?:html|txt)$      "public, max-age=0, must-revalidate";
    # Lo de /_next/static/ lleva hash en el nombre: si cambia el contenido,
    # cambia la URL. Las fuentes de /fonts/ no llevan hash: reemplazar una sin
    # cambiarle el nombre no llega a quien ya la tiene cacheada.
    ~*\.(?:css|js|woff2)$  "public, max-age=31536000, immutable";
    ~*\.(?:svg|ico|png)$   "public, max-age=2592000";
    default                "public, max-age=3600";
}

# Un solo dominio canónico, sin www. Con explícito https: acá dentro $scheme
# vale "http" y la redirección mandaría al visitante de vuelta a Traefik por
# el puerto 80.
server {
    listen 80;
    server_name ~^www\.(?<dominio_raiz>.+)$;
    return 301 https://$dominio_raiz$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Redirecciones relativas (`Location: /privacidad`). Absolutas, nginx las
    # arma con su propio esquema y puerto: `http://cliniventas.com:80/...`.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    # Las fuentes .woff2 ya vienen comprimidas: no se listan.
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml application/manifest+json;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Sin HSTS ni CSP, igual que en el hosting anterior:
    # - HSTS con includeSubDomains alcanzaría a todos los CRM de
    #   *.cliniventas.com y los navegadores lo recuerdan durante meses.
    # - La plantilla lleva un <script> en línea (el que evita el parpadeo de
    #   tema, src/app/layout.tsx): una CSP estricta lo bloquea salvo que se
    #   agregue su hash a script-src.

    # Página de error propia (src/app/not-found.tsx), no la de nginx.
    error_page 404 /404.html;

    # Nadie tiene que ver un .html en la barra de direcciones. Se mira
    # $request_uri (lo que escribió el visitante) y no $uri: así las
    # reescrituras internas de más abajo no entran en bucle.
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /$1;
    }
    if ($request_uri ~ "^(/.+)\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # /privacidad/ y /privacidad serían dos URL para la misma página.
    rewrite ^/(.+)/$ /$1 permanent;

    # Ni .htaccess, ni .git, ni nada que empiece con punto.
    location ~ /\. {
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Next escribe una página por ruta (`privacidad.html`) y además un
    # directorio homónimo (`privacidad/`) con los .txt de la navegación sin
    # recarga. `try_files` sin barra final solo acepta archivos, así que el
    # directorio no estorba: /privacidad cae en privacidad.html.
    location / {
        try_files $uri $uri.html =404;
    }
}
