# Reglas de acceso de PostgreSQL. Las monta compose.db.yml como hba_file.
#
# Se versiona a proposito: no contiene secretos y define quien puede entrar,
# asi que conviene que cualquier cambio pase por revision.
#
# El orden importa: PostgreSQL aplica la PRIMERA regla que coincide.

# TYPE      DATABASE  USER  ADDRESS   METHOD

# Socket dentro del contenedor: mantenimiento y pg_dump. Con contrasena y no
# `trust`, para que `docker exec` no sea una puerta abierta a los datos.
local       all       all             scram-sha-256

# TLS obligatorio para TODA conexion de red, incluida la de la propia
# aplicacion. Por eso backend/.env necesita DATABASE_SSL=require.
#
# Lo intuitivo seria eximir a la red interna de Docker, que no sale de la
# maquina, con algo como "host all all 172.16.0.0/12 scram-sha-256". Se probo
# y tiene un problema: segun como Docker publique el puerto, el trafico que
# entra desde otra maquina llega con la direccion de la puerta de enlace de esa
# misma red, indistinguible de un contenedor. Medido en Docker Desktop, una
# conexion externa SIN cifrar entraba por esa regla.
#
# La forma limpia de distinguirlos seria fijar la subred y rechazar la puerta
# de enlace por direccion. Tambien se probo, y rompe el despliegue: Docker no
# cambia la subred de una red existente, intenta recrearla, para la base y
# falla con "network has active endpoints" porque el backend sigue conectado.
#
# Asi que se exige cifrado a todo. El coste es que la aplicacion tambien cifra
# -irrelevante en la misma maquina- y a cambio la garantia no depende de como
# Docker enrute ni de que nadie recree una red.
hostssl     all       all   all       scram-sha-256

# Lo que llegue sin cifrar, rechazado. Es lo que convierte la regla anterior en
# obligatoria en vez de en una preferencia: sin esta linea, una conexion en
# claro buscaria la siguiente regla que coincida.
hostnossl   all       all   all       reject
