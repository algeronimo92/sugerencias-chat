# Observabilidad: Prometheus + Grafana + Loki + Alertmanager + exporters.
#
# Proyecto de compose propio y separado del deploy blue-green de la app:
# nada de esto se recrea, se apaga ni se ve afectado por
# scripts/deploy-bluegreen.sh.
#
# Todo corre en network_mode: host, igual que traefik
# (traefik/reverse-proxy.docker-compose.yml), y cada proceso se ata a
# 127.0.0.1 con su propio flag. Así ningún puerto de monitoreo queda
# expuesto a Internet aunque el host no tenga firewall — el único público es
# Grafana, y llega por Traefik (ver traefik/dynamic/grafana.yml), nunca por
# su puerto directo.
#
#   docker compose -f compose.monitoring.yml --env-file monitoring/.env up -d

name: monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 84 GB libres en disco y una app chica: 30 días de métricas no pesa
      # nada acá. Ajustar si crece mucho.
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      # Se monta el directorio, no cada archivo: un bind-mount de archivo
      # suelto fija el inodo, y `git checkout`/`git pull` reemplazan el
      # archivo en vez de editarlo in-place, así que el contenedor se queda
      # sirviendo el contenido viejo indefinidamente y el SIGHUP recarga eso.
      # Pasó con alert-rules.yml (siguió con la alerta por acumulado tras
      # f8266a0) y con prometheus.yml (sin el override de `instance`).
      # El directorio es propio y no `./monitoring` porque ahí viven .env y
      # secrets/, que no tienen por qué entrar a este contenedor.
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus.
      # El archivo de adentro lo genera scripts/render-alertmanager-config.sh
      # a partir de monitoring/alertmanager.yml.template — ver ese template
      # para el porqué (url_file hace panic en esta versión de Alertmanager).
      # Está gitignoreado: trae embebida la URL del webhook de n8n.
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    network_mode: host
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus. Acá
      # muerde todavía más que en el resto, porque Loki no recarga config en
      # caliente: se lo recrea, y un `docker compose up -d` no recrea nada si
      # el único cambio es el contenido del archivo montado.
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki

  alloy:
    # Reemplaza a Promtail, EOL desde 2026-03-02 (sin más parches de
    # seguridad). monitoring/alloy/config.alloy se generó con `alloy convert
    # --source-format=promtail` a partir del viejo
    # monitoring/promtail-config.yml (borrado acá; está en git hasta 8201703),
    # así que el pipeline de labels es el mismo: container + stream.
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      # Alloy sirve su UI/API de debug en :12345 y por defecto bindea a
      # 0.0.0.0. Con network_mode: host eso la dejaría abierta a Internet
      # (el host no tiene firewall), así que va a loopback como el resto.
      - --server.http.listen-addr=127.0.0.1:12345
      # Acá viven las posiciones de lectura. Promtail las guardaba en
      # /tmp/positions.yaml dentro del contenedor y las perdía en cada
      # recreate, lo que causaba relectura de logs; el volumen las persiste.
      - --storage.path=/var/lib/alloy/data
    volumes:
      # Directorio y no archivo suelto: ver el comentario en prometheus.
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=127.0.0.1:9100

  cadvisor:
    # v0.49.1 (2024) no reconoce el layout de metadata de contenedores que
    # trae Docker 29: "failed to identify the read-write layer ID" en cada
    # contenedor, y container_memory_usage_bytes/etc. quedaban sin las
    # labels name/image (imposible filtrar por contenedor). v0.55.1 sí lo
    # soporta — verificado en este mismo host antes de fijarlo acá.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    network_mode: host
    environment:
      # El HEALTHCHECK de la imagen pega a esta URL vía wget; sin definirla
      # queda vacía y el contenedor se marca "unhealthy" aunque cadvisor
      # responda bien — pasa porque --port lo movió del 8080 por defecto al
      # 9280 (loopback, junto al resto del stack de monitoreo). 127.0.0.1 y
      # no "localhost": /etc/hosts del contenedor lo resuelve primero a ::1
      # y cadvisor solo escucha en IPv4, así que "localhost" da siempre
      # "connection refused" aunque el healthcheck apunte al puerto correcto.
      - CADVISOR_HEALTHCHECK_URL=http://127.0.0.1:9280/healthz
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --port=9280
      - --listen_ip=127.0.0.1

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    network_mode: host
    environment:
      # Generado por scripts/monitoring-setup.sh (rol de solo lectura
      # pg_monitor). sslmode=require porque db/pg_hba.conf exige TLS a toda
      # conexión de red.
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DSN:?definir POSTGRES_EXPORTER_DSN en monitoring/.env, ver scripts/monitoring-setup.sh}
      - PG_EXPORTER_WEB_LISTEN_ADDRESS=127.0.0.1:9187

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_ROOT_URL=https://grafana.chat.dermicapro.app
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?definir GRAFANA_ADMIN_PASSWORD en monitoring/.env}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - grafana-data:/var/lib/grafana
      # Directorios y no archivos sueltos: ver el comentario en prometheus.
      # Se montan las dos carpetas hoja de provisioning y no provisioning/
      # entera para no tapar alerting/, plugins/ y demás que trae la imagen.
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboard-provider:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
