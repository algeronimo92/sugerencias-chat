# Pruebas de las reglas de alerta, para `promtool test rules`:
#
#   docker run --rm -v "$PWD/monitoring/prometheus:/rules:ro" \
#     --entrypoint promtool prom/prometheus:v3.13.2 \
#     test rules /rules/alert-rules.test.yml
#
# Existen porque una alerta mal escrita no falla: se queda callada. Un nombre
# de métrica cambiado, una etiqueta que el exporter no pone o un `\.` de más en
# el regex dan exactamente el mismo resultado que "todo está bien", y sólo se
# descubre el día que hacía falta que sonara. Acá se afirma lo contrario: con
# estos datos de entrada, la alerta SÍ dispara — y, donde importa, que NO
# dispara en el caso que parece una caída y no lo es.
#
# Prometheus no lee este archivo: rule_files en prometheus.yml nombra sólo
# alert-rules.yml.
rule_files:
  - alert-rules.yml

evaluation_interval: 1m

tests:
  # El Watchdog tiene que estar disparado siempre: si no suena, Healthchecks.io
  # avisa que el monitoreo se cayó, aunque esté todo bien.
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "El monitoreo está vivo (alerta permanente, no requiere acción)"

  # La cola de entrada: durante un deploy los dos colores miden la misma tabla.
  # Tiene que sonar una sola vez, no una por color.
  - interval: 1m
    input_series:
      - series: 'meta_webhook_inbox_oldest_pending_age_seconds{job="worker", color="blue", instance="sugerencias-chat-blue-worker-1"}'
        values: "0 600 600 600 600 600 600 600"
      - series: 'meta_webhook_inbox_oldest_pending_age_seconds{job="worker", color="green", instance="sugerencias-chat-green-worker-1"}'
        values: "0 600 600 600 600 600 600 600"
    alert_rule_test:
      - eval_time: 3m
        alertname: InboxMetaAtascado
        exp_alerts: []
      - eval_time: 7m
        alertname: InboxMetaAtascado
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Mensajes de WhatsApp recibidos hace más de 5 minutos que no entraron al CRM"
              description: "El worker del inbox de Meta está detenido o fallando. Evento pendiente más viejo: 600s."

  # Un evento perdido suena enseguida y se apaga solo cuando sale de la ventana.
  - interval: 1m
    input_series:
      - series: 'meta_webhook_inbox_exhausted_last_hour{job="worker", instance="sugerencias-chat-blue-worker-1"}'
        values: "0 1 1 0"
    alert_rule_test:
      - eval_time: 0m
        alertname: InboxMetaEventosPerdidos
        exp_alerts: []
      - eval_time: 1m
        alertname: InboxMetaEventosPerdidos
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Eventos de WhatsApp agotaron sus reintentos y no llegaron al CRM"
              description: "Revisar last_error en public.webhook_inbox (status failed, attempts >= 10): token de Meta vencido, medio que no baja o un bug. Última hora: 1."
      - eval_time: 3m
        alertname: InboxMetaEventosPerdidos
        exp_alerts: []

  # La outbox es la cola de salida del sistema. Un pendiente que
  # envejece más de dos minutos es un vendedor viendo "no enviado".
  - interval: 1m
    input_series:
      - series: 'outbox_oldest_pending_age_seconds{job="worker", instance="sugerencias-chat-blue-worker-1"}'
        values: "0 0 300 300 300 300"
    alert_rule_test:
      # Aparece en el minuto 2; con for: 1m todavía está pendiente.
      - eval_time: 2m
        alertname: OutboxAtascado
        exp_alerts: []
      - eval_time: 4m
        alertname: OutboxAtascado
        exp_alerts:
          - exp_labels:
              severity: critical
              job: worker
              instance: sugerencias-chat-blue-worker-1
            exp_annotations:
              summary: "Mensajes esperando en message_outbox hace más de 2 minutos"
              description: "Los vendedores están mandando mensajes que no salen. outbox_oldest_pending_age_seconds = 300s."

  # Blue-green: en cada momento uno de los dos colores está apagado y su
  # target en `up == 0`. Eso es lo normal de cada deploy y NO es una caída. La
  # regla suma los dos targets: dispara sólo cuando no queda ninguno.
  - interval: 1m
    input_series:
      - series: 'up{job="backend", color="blue", instance="sugerencias-chat-blue-backend-1"}'
        values: "1 1 1 1 1 1 1 1"
      - series: 'up{job="backend", color="green", instance="sugerencias-chat-green-backend-1"}'
        values: "1 1 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 7m
        alertname: BackendCaido
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="backend", color="blue", instance="sugerencias-chat-blue-backend-1"}'
        values: "1 1 0 0 0 0 0 0"
      - series: 'up{job="backend", color="green", instance="sugerencias-chat-green-backend-1"}'
        values: "0 0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: BackendCaido
        exp_alerts: []
      - eval_time: 5m
        alertname: BackendCaido
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Ningún color (blue/green) del backend responde"
