services:
  traefik:
    # Fijado a propósito. Con "latest", un `up -d` cualquiera podía traer una
    # versión mayor y cambiar el enrutado sin que nadie lo pidiera — algo que
    # importa más ahora que el despliegue depende de que traefik conmute bien.
    image: traefik:3.7.10
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Proveedor de archivo: es lo que hace posible el blue-green. Las
      # etiquetas de Docker son inmutables, así que cambiar de color con
      # etiquetas obligaría a recrear contenedores — justo lo que se quiere
      # evitar. Traefik relee este directorio en caliente, de modo que
      # conmutar el tráfico es reescribir un archivo.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # DNS-01 con Hostinger, que es donde viven estos dominios. Un solo
      # certificado `*.cliniventas.com` cubre a todos los negocios, presentes y
      # futuros: dar de alta una empresa ya no pide tocar este repo. El
      # proveedor `hostinger` viene compilado en traefik 3.7.10 (lego >= 4.27)
      # y lee HOSTINGER_API_TOKEN de traefik/.env, que se monta por env_file.
      # Sin ese token no se emite nada; el despliegue lo comprueba antes de
      # tocar producción.
      #
      # Reemplaza a HTTP-01, que emitía un certificado por host listado a mano
      # y no podía dar wildcard. Los dos desafíos no conviven en el mismo
      # resolver. Los certificados por host que quedaron en acme.json se
      # siguen sirviendo hasta que el wildcard esté emitido, así que no hace
      # falta vaciarlo para el cambio.
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=hostinger
      # Antes de avisarle a Let's Encrypt, lego comprueba que el TXT del
      # desafío ya se ve. Con network_mode: host preguntaba al resolver local
      # del VPS (127.0.0.53), que no lo vio en el minuto que lego espera por
      # defecto, y la emisión fallaba. Se pregunta a resolvers públicos, que
      # es lo más parecido a lo que consulta Let's Encrypt, y la espera sube
      # con HOSTINGER_PROPAGATION_TIMEOUT (abajo).
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    env_file:
      - .env
    environment:
      # Segundos que lego espera a que el TXT del desafío se vea en los
      # resolvers, y cada cuánto vuelve a mirar. El DNS de Hostinger tarda más
      # que el minuto por defecto.
      - HOSTINGER_PROPAGATION_TIMEOUT=600
      - HOSTINGER_POLLING_INTERVAL=15
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # En sólo lectura: traefik nunca escribe aquí, sólo observa. Quien
      # reescribe el archivo es scripts/deploy-bluegreen.sh, desde el host.
      - ./dynamic:/dynamic:ro

volumes:
  traefik-letsencrypt:
