# Configuración de RabbitMQ. Se monta en /mq/rabbitmq.conf —no en la ruta por
# defecto /etc/rabbitmq/rabbitmq.conf— porque compose.mq.yml monta la carpeta
# mq/ entera y no archivo por archivo (el porqué está allá). Quien le dice al
# broker dónde buscarla es RABBITMQ_CONFIG_FILE.

# Topología declarada en un archivo, cargada en cada arranque. La importación
# es aditiva e idempotente: no borra lo que ya existe, así que se puede volver
# a arrancar sin miedo a perder mensajes encolados.
load_definitions = /mq/definitions.json

# Cuánto puede tardar un consumidor en confirmar (ack) un mensaje antes de que
# el broker dé por colgado el canal, lo cierre y devuelva el mensaje a la cola.
#
# Este número es el techo real de cuánto puede durar una ejecución de n8n sobre
# un mensaje. Es el motivo por el que el debounce del analista tuvo que salir
# del workflow de ingesta: mientras la ejecución no termina, el mensaje sigue
# sin ackear y consume este presupuesto.
#
# 30 minutos es el valor por defecto de RabbitMQ; se deja escrito para que la
# restricción sea visible y no una sorpresa. Si algún día una ingesta legítima
# se acerca a este número, el arreglo es acortar la ingesta, no subir esto.
consumer_timeout = 1800000

# RabbitMQ bloquea a los que publican cuando el disco baja de este umbral. Con
# el default (50 MB) el bloqueo llega tan tarde que el servidor ya está en
# problemas; 2 GB da margen para darse cuenta. Un publicador bloqueado no
# pierde mensajes, se queda esperando: Evolution los acumula en su lado.
#
# OJO: provision.sh usa este valor como testigo de que ESTE archivo se cargó
# (es el ajuste que más se aleja del default, así que sirve de huella). Si se
# cambia acá, hay que cambiarlo allá o el despliegue falla avisando de una
# configuración perdida que en realidad está bien. Allá se aceptan tanto `2GB`
# como los bytes: RabbitMQ devuelve la cadena tal cual está escrita acá.
disk_free_limit.absolute = 2GB

# La consola escucha en todas las interfaces DEL CONTENEDOR; quien restringe el
# acceso es la publicación de puertos de compose.mq.yml, que la ata a 127.0.0.1
# del host. No se expone por Traefik.
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672

# Sin métricas por mensaje: en instalaciones con muchas colas ese detalle es la
# causa principal de consumo de CPU del plugin de management. Las métricas por
# cola, que son las que interesan (profundidad, consumidores), se mantienen.
management_agent.disable_metrics_collector = false
collect_statistics_interval = 15000

# Métricas para Prometheus (plugin rabbitmq_prometheus, puerto 15692).
#
# `return_per_object_metrics` es la línea que hace que esto sirva de algo. Por
# defecto /metrics devuelve solo agregados del nodo: `rabbitmq_queue_messages`
# viene SIN la etiqueta `queue`, así que no se puede distinguir la DLQ de la
# cola de entrada y no hay forma de escribir la alerta. Con esto en true cada
# cola trae su propia serie etiquetada, que es lo que consultan las reglas
# DlqConMensajes / IngestaSinConsumidor de monitoring/prometheus/alert-rules.yml.
#
# El costo que la documentación advierte (una serie por objeto) es teórico acá:
# este vhost tiene siete colas y un puñado de conexiones. Si algún día se
# multiplican, la alternativa es dejar esto en false y scrapear el endpoint
# /metrics/detailed?family=queue_coarse_metrics — pero ojo, ahí las métricas
# se llaman `rabbitmq_detailed_*` y hay que reescribir las reglas.
prometheus.return_per_object_metrics = true
prometheus.tcp.port = 15692

# Registro en la salida estándar, para que `docker logs` y el stack de Loki lo
# recojan como el resto de los servicios.
log.console = true
log.console.level = info
log.file = false
