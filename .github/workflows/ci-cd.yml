name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      # Smoke test: la app tiene que poder importarse sin tocar una DB o n8n real.
      - run: |
          DATABASE_URL="postgresql+asyncpg://u:p@localhost/db" \
          N8N_WEBHOOK_URL="https://example.com/webhook/x" \
          SECRET_KEY="ci-smoke-test-key" \
          python -c "import main"
      # config.py construye Settings() al importarse, y sin .env en el runner
      # esas dos variables son obligatorias. Ningún test toca PostgreSQL real:
      # usan dobles, y el 401 de media ocurre antes de consultar la base.
      - name: Tests
        env:
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
          N8N_WEBHOOK_URL: "https://example.com/webhook/x"
          SECRET_KEY: "ci-test-key"
        run: python -m pytest

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend-check ./backend
      - name: Build frontend image (prod target)
        run: docker build -t frontend-check --target prod --build-arg VITE_API_BASE_URL="" ./frontend
      # nginx.conf tiene "proxy_pass http://backend:8000;" — nginx resuelve ese
      # hostname ya al cargar la config, así que validarlo aislado (sin un
      # contenedor "backend" real en la misma red) siempre falla con "host
      # not found in upstream", sin que eso diga nada sobre si el config
      # está bien. Se arma la misma topología que docker-compose en prod:
      # una red con un "backend" de mentira, y ahí sí se valida.
      - name: Verify nginx.conf against a real "backend" hostname
        run: |
          docker network create ci-net
          docker run -d --name backend --network ci-net python:3.12-slim python -m http.server 8000
          docker run -d --name frontend --network ci-net frontend-check
          sleep 2
          docker exec frontend nginx -t
          docker ps --filter name=frontend --filter status=running --format '{{.Names}}' | grep -qx frontend
      - name: Cleanup check containers
        if: always()
        run: |
          docker rm -f backend frontend 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  deploy:
    needs: [frontend-checks, backend-checks, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.VPS_PROJECT_PATH }}

            COMPOSE="docker compose -f docker-compose.prod.yml -f traefik/docker-compose.yml"

            # Se guarda antes de mover nada: es el punto al que se vuelve si la
            # versión nueva no llega a responder.
            PREVIOUS=$(git rev-parse HEAD)
            echo "Versión en curso: $PREVIOUS"

            git fetch origin main
            git reset --hard origin/main
            echo "Desplegando: $(git rev-parse HEAD)"

            # El backend responde /health/ready sólo si alcanza PostgreSQL y el
            # almacenamiento multimedia, así que sirve de comprobación real y no
            # sólo de "el proceso arrancó". El start_period del healthcheck es de
            # 60 s; se concede el doble antes de dar el despliegue por fallido.
            wait_until_healthy() {
              i=0
              while [ $i -lt 40 ]; do
                if $COMPOSE exec -T backend python -c \
                     "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)" \
                     >/dev/null 2>&1; then
                  # Y de paso el camino completo: traefik -> nginx -> SPA.
                  # Va contra el 443 con --resolve, no contra el 80: traefik
                  # redirige http a https, así que una petición al 80 devuelve
                  # un 301 que curl da por bueno sin haber tocado nginx.
                  if curl -fsSk -o /dev/null \
                       --resolve chat.dermicapro.app:443:127.0.0.1 \
                       https://chat.dermicapro.app/; then
                    return 0
                  fi
                fi
                i=$((i + 1))
                sleep 5
              done
              return 1
            }

            if $COMPOSE up -d --build && wait_until_healthy; then
              echo "Despliegue verificado"
              # Se conservan las imágenes de la última semana: son las que
              # permiten revertir sin reconstruir desde cero.
              docker image prune -f --filter "until=168h"
            else
              echo "El despliegue no respondió sano. Revirtiendo a $PREVIOUS"
              git reset --hard "$PREVIOUS"
              $COMPOSE up -d --build
              if wait_until_healthy; then
                echo "Reversión completada: producción quedó en $PREVIOUS"
              else
                echo "ATENCIÓN: la reversión tampoco responde. Requiere intervención manual."
              fi
              exit 1
            fi
