global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

# Todos los targets llevan un `instance` propio en vez del `127.0.0.1:puerto`
# que Prometheus pone por defecto: como todo corre en network_mode host, la
# IP es siempre la misma y lo único que distingue un target de otro es el
# puerto. En las notificaciones de Alertmanager (el workflow de n8n arma el
# "Objetivo:" con name || instance || job) eso llegaba como "127.0.0.1:9081"
# y no había forma de saber a qué contenedor se refería.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: {instance: prometheus}

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels: {instance: host-vps}

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:9280"]
        labels: {instance: cadvisor}

  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels: {instance: dermicapro-data-postgres-1}

  # RabbitMQ expone sus métricas él mismo (plugin rabbitmq_prometheus), sin
  # exporter aparte. El 15692 lo publica compose.mq.yml solo en loopback.
  #
  # Las series por cola (rabbitmq_queue_messages{queue=...}, que es lo que
  # consultan las alertas de la ingesta) solo aparecen porque mq/rabbitmq.conf
  # pone `prometheus.return_per_object_metrics = true`. Sin esa línea este
  # target responde igual, con métricas agregadas del nodo y sin la etiqueta
  # `queue`: las reglas no encuentran nada y no disparan nunca. Un scrape sano
  # con alertas ciegas es peor que un target caído, así que si se toca esa
  # config hay que revisar acá.
  - job_name: rabbitmq
    static_configs:
      - targets: ["127.0.0.1:15692"]
        labels: {instance: dermicapro-mq-rabbitmq-1}

  # Ritmo de publicación por cola. El endpoint /metrics normal expone
  # profundidad y consumidores, pero no el contador que permite distinguir
  # una cola vacía y sana de una cola que dejó de recibir eventos. Se pide
  # únicamente queue_exchange_metrics para no habilitar todas las familias
  # detalladas (las métricas por canal son mucho más costosas).
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family: [queue_exchange_metrics]
    static_configs:
      - targets: ["127.0.0.1:15692"]
        labels: {instance: dermicapro-mq-rabbitmq-1}

  # blue y green: en cada momento uno de los dos targets está "down" (el
  # color que deploy-bluegreen.sh apagó) — es normal, no dispara la alerta
  # BackendCaido (esa exige que caigan LOS DOS). Ver
  # frontend/nginx.conf y compose.bluegreen.yml (METRICS_PORT) para cómo
  # llega esto hasta acá.
  #
  # El puerto 9081/9082 lo publica el nginx del frontend (frontend/nginx.conf,
  # server :9113), que hace proxy a backend:8000/metrics — de ahí que el
  # instance apunte al contenedor de backend, que es quien produce la métrica.
  - job_name: backend
    metrics_path: /metrics
    # Prometheus 3 valida el Content-Type de la respuesta y falla el scrape
    # si no lo reconoce, en vez de asumir texto plano como hacía v2. Este es
    # el único target que no habla directo con su exporter: pasa por el nginx
    # del frontend. proxy_pass reenvía el header del upstream tal cual y
    # prometheus-fastapi-instrumentator manda el correcto, así que en teoría
    # no hace falta — pero si algún día se mete un middleware o un cambio de
    # nginx en el medio, esto evita quedarse ciego del backend sin enterarse.
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["127.0.0.1:9081"]
        labels: {color: blue, instance: sugerencias-chat-blue-backend-1}
      - targets: ["127.0.0.1:9082"]
        labels: {color: green, instance: sugerencias-chat-green-backend-1}
